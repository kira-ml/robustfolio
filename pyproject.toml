[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robustfolio"
version = "0.2.0"
description = "Walk-forward, cost-aware portfolio rebalancing benchmark"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }

# Runtime dependencies. `pip install -e .` must be sufficient to run the harness
# and the report: a reproduction path that needs a second, undocumented install
# step is not a reproduction path.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "cvxpy>=1.4",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The working paper. Deliberately not a runtime dependency: `pip install -e .`
# must stay enough to run the harness and the report, and a reproduction path
# that needs a typesetting engine is not a reproduction path. Typst ships its
# own fonts in the wheel, so the PDF renders identically on CI and on a laptop
# without any font installation.
paper = ["typst>=0.11", "pypdf>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]
