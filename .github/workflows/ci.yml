name: CI

permissions:
  contents: read

# What this workflow is for
# ------------------------
# The claim this repository makes is "check these numbers", so the thing worth
# automating is not "does the code import" but "does the executable definition of
# leakage still fail when leakage is present". The leakage suite is the reason
# this workflow exists.
#
# The suite is green on a fresh clone by construction: tests that need the frozen
# snapshot skip with an explanatory reason (see tests/conftest.py), because a CI
# that is red until you obtain data teaches people to ignore CI.
#
# The snapshot is NOT distributed: the Yahoo and FRED terms do not permit
# redistribution (DEC-20261106-042). CI therefore does not fetch an archive and
# does not claim to run the end-to-end comparison. That comparison remains a local
# check for anyone who independently holds an archive; it is documented in
# docs/published-run/README.md and is not a CI guarantee.
#
# What CI does run beyond the suite: rebuild the one-pager and the paper from the
# committed tables. Those need no snapshot and no network, and they are the parts
# a reader can actually reproduce.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  # Frozen provenance. The archive itself is no longer published, but its identity
  # remains the reference the published tables were computed from. The names are
  # checked against each other, and against the snapshot on disk, by
  # tests/test_snapshot_name_literals.py: one wrong separator here is a 404 that
  # looks exactly like the right name (finding F32).
  RELEASE_TAG: v1.0.0
  SNAPSHOT_ASSET: robustfolio-snapshot-yahoo-usetf-2007-01-01_2026-09-30-2026-10-17-2ad06139.tar.gz
  SNAPSHOT_ID: yahoo-usetf-2007-01-01_2026-09-30-2026-10-17-2ad06139
  # The digest of the withdrawn distribution, recorded for provenance. It is not a
  # download and CI does not fetch it.
  ARCHIVE_SHA256: 7a3fc20991b664099ada44a308dfde57d8080994ff498e2f5a0dd98f2ecab77d

jobs:
  tests:
    runs-on: ubuntu-latest
    # One interpreter, not a matrix. The environment is frozen on purpose (the
    # solver tolerance and the bootstrap seed are part of the result), so a
    # second Python version would test a configuration nobody quotes numbers from.
    steps:
      # Pinned to the commit behind the major tag, not the moving tag itself.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,paper]"

      - name: Tests
        run: python -m pytest -q

      - name: Synthetic end-to-end pipeline
        # No vendor data, no network: the real harness and report path on a
        # deterministic synthetic panel. This is a demonstration, not a
        # reproduction of the published sample.
        run: python scripts/run_synthetic_demo.py --out /tmp/synthetic-demo

      - name: The one-pager renders from the committed tables alone
        # Unconditional, unlike the steps below: the public page needs no snapshot
        # and no download, because its numbers are read from docs/published-run/.
        # If this step ever has to skip, the page has quietly started depending on
        # something a stranger would not have.
        run: python scripts/make_onepager.py --out /tmp/onepager

      - name: The working paper builds from the committed tables alone
        # Same argument as the one-pager: no snapshot, no network, one command.
        # tests/test_paper.py rebuilds the PDF and checks every table value in it,
        # so this step is "it compiles" and the test is "it still says what the
        # run supports". Neither can be skipped without the other noticing.
        run: python scripts/build_paper.py --out /tmp/working-paper.pdf
